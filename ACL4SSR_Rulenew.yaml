pr:
  &pr {
    type: select,
    proxies:
      [
        🚀 默认代理,
        🔯 香港故转,
        🔯 日本故转,
        ♻️ 香港自动,
        ♻️ 日本自动,
        ♻️ 美国自动,
        ♻️ 德国自动,
        ♻️ 自动选择,
        🇭🇰 香港节点,
        🇯🇵 日本节点,
        🇩🇪 德国节点,
        🇺🇲 美国节点,
        🌐 全部节点,
        直连,
      ],
  }
ur:
  &ur {
    type: url-test,
    tolerance: 50,
    interval: 300,
    url: https://i.ytimg.com/generate_204,
    timeout: 1000,
    proxies:
      [
        🚀 默认代理,
        🔯 香港故转,
        🔯 日本故转,
        🔯 台韩新故转,
        ♻️ 香港自动,
        ♻️ 日本自动,
        ♻️ 美国自动,
        ♻️ 德国自动,
        ♻️ 自动选择,
      ],
  }
proxy-groups:
  - {
      name: 🚀 默认代理,
      type: select,
      proxies:
        [
          🔯 香港故转,
          🔯 日本故转,
          ♻️ 香港自动,
          ♻️ 日本自动,
          ♻️ 美国自动,
          ♻️ 德国自动,
          ♻️ 自动选择,
          🇭🇰 香港节点,
          🇯🇵 日本节点,
          🇩🇪 德国节点,
          🇺🇲 美国节点,
          🌐 全部节点,
        ],
    }
  - { name: 🪟 Cloudflare, <<: *pr }
  - { name: 👨🏿‍💻 GitHub, <<: *pr }
  - { name: 📹 油管视频, <<: *pr }
  - { name: 🍃 谷歌服务, <<: *ur }
  - { name: 🤖 ChatGPT, <<: *pr }
  - { name: 🐬 OneDrive, <<: *pr }
  - { name: 🎯 全球直连, type: select, proxies: [直连, 🚀 默认代理] }
  - { name: 🐟 漏网之鱼, <<: *ur }
  - {
      name: 🇭🇰 香港节点,
      type: select,
      include-all: true,
      filter: "(?i)港|hk|hongkong|hong kong",
    }
  - {
      name: 🇯🇵 日本节点,
      type: select,
      include-all: true,
      filter: "(?i)日|jp|japan",
    }
  - {
      name: 🇺🇲 美国节点,
      type: select,
      include-all: true,
      filter: "(?i)美|us|unitedstates|united states",
    }
  - {
      name: 🇩🇪 德国节点,
      type: select,
      include-all: true,
      filter: "(?i)德|de|germany|荷兰|英|巴|法|意|西|瑞士|瑞典|挪威|芬兰|丹麦|奥地利|比利时|爱尔兰|葡萄牙|希腊|捷克|匈牙利|波兰|罗马尼亚|斯洛伐克|保加利亚",
    }
  - {
      name: 🔯 香港故转,
      type: fallback,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$",
    }
  - {
      name: 🔯 日本故转,
      type: fallback,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$",
    }
  - {
      name: ♻️ 香港自动,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$",
    }
  - {
      name: ♻️ 德国自动,
      type: url-test,
      include-all: true,
      tolerance:20,
      interval: 300,
      filter: "(?=.*(德|de|germany|荷兰|英|巴|法|意|西|瑞士|瑞典|挪威|芬兰|丹麦|奥地利|比利时|爱尔兰|葡萄牙|希腊|捷克|匈牙利|波兰|罗马尼亚|斯洛伐克|保加利亚))^((?!(港|台|韩|新)).)*$",
    }
  - {
      name: ♻️ 日本自动,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$",
    }
  - {
      name: ♻️ 美国自动,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$",
    }
  - {
      name: ♻️ 自动选择,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "^((?!(直连)).)*$",
    }
  - { name: 🌐 全部节点, type: select, include-all: true }

