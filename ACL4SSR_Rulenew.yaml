# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
pr:
  &pr {
    type: select,
    proxies:
      [
          🍃 自动选择,
          🔯 香港故转,
          ♻️ 香港自动,
          🇭🇰 香港节点,
          DE 德国节点,
          DE 德国自动,
          🇨🇳 台湾节点,
          🇸🇬 狮城节点,
          🇯🇵 日本节点,
          🇺🇲 美国节点,
          🔯 🇺🇲 美国故转,
          🇰🇷 韩国节点,
          🚀 手动切换,
          DIRECT,
      ],
  }
proxy-groups:
  - {
      name: 🚀 节点选择,
      type: select,
      proxies:
        [
          🍃 自动选择,
          🇭🇰 香港节点,
          DE 德国节点,
          🇨🇳 台湾节点,
          🇸🇬 狮城节点,
          🇯🇵 日本节点,
          🇺🇲 美国节点,
          🇰🇷 韩国节点,
          🚀 手动切换,
          DIRECT,
        ],
    }
  - { 
      name: 🍃 自动选择,
      type: url-test,
      include-all: true,
      interval: 300,
      tolerance: 50,
    }
  - { 
      name: 🎯 全球直连,
      type: select,
      proxies:
        [
          DIRECT,
          🚀 节点选择,
          🍃 自动选择,
        ],    
    } 
  - {
      name:🚀 手动切换,
      type: select,
      proxies:
        [
          include-all: true
          type: select
          DIRECT,
        ],    
    }  
  - { name: 📹 YouTube, <<: *pr }
  - { name: 🤖 ChatGPT, <<: *pr }
  - { name: 👨🏿‍💻 GitHub, <<: *pr }
  - { name: 📺 cloudflare, <<: *pr }
  - { name: 🌏 国内媒体, <<: *pr }
  - { name: 🌏 国外媒体, <<: *pr }
  - { name: 🎵 TikTok, <<: *pr }
  - { name: 📲 Telegram, <<: *pr }
  - { name: 🍀 Google, <<: *pr }
  - { name: 🐟 漏网之鱼, <<: *pr }
  #- { name: 🎥 NETFLIX, <<: *pr }
  #- { name: ✈️ Speedtest, <<: *pr }
  #- { name: 💶 PayPal, <<: *pr }
  #- { name: 🍎 Apple, type: select, proxies: [直连, 🚀 默认代理] }
  #- { name: 🎯 直连, type: select, proxies: [直连, 🚀 默认代理] }
  #- {  name: 🛑 广告拦截,type: select,proxies:[REJECTm,DIRECT]}
  #- {  name: 🍃 应用净化,type: select,proxies:[REJECTm,DIRECT]}
  - {
      name: 🇭🇰 香港节点,
      include-all: true,
      filter: (?i)港|HK|hk|Hong Kong|HongKong|hongkong|其他,
      type: select,
      interval: 300,
      tolerance: 50,
    }
  - {
      name: 🇯🇵 日本节点,
      include-all: true,
      filter: (?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan,
      type: select,
      interval: 300,
      tolerance: 50,
    }
  - {
      name: 🇺🇲 美国节点,
      include-all: true,
      filter: (?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States,
      type: select,
      interval: 300,
      tolerance: 50,
    }
  - {
      name: DE 德国节点,
      include-all: true,
      filter: (?i)德|英|俄罗斯|法|荷|阿|芬兰|瑞|挪威|丹麦,
      type: select,
      interval: 300,
      tolerance: 50,
    }  
  - {
      name: 🇨🇳 台湾节点,
      include-all: true,
      filter: (?i)台|新北|彰化|TW|Taiwan,
      type: select,
      interval: 300,
      tolerance: 50,
    }
  - {
      name: 🇸🇬 狮城节点,
      include-all: true,
      filter: (?i)新加坡|坡|狮城|SG|Singapore,
      type: select,
      interval: 300,
      tolerance: 50,
    }
  - {
      name: 🇰🇷 韩国节点,
      include-all: true,
      filter: (?i)KR|Korea|KOR|首尔|韩|韓,
      type: select,
      interval: 300,
      tolerance: 50,
    }
  - {
      name: 🔯 香港故转,
      include-all: true,
      filter: (?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$,
      type: fallback,
      interval: 300,
      tolerance: 20,
    }
  - {
      name: 🔯 🇺🇲 美国故转,
      include-all: true,
      filter: (?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$,
      type: fallback,
      interval: 300,
      tolerance: 20,
    }
  - {
      name: ♻️ 香港自动,
      include-all: true,
      filter: (?=.*(港|HK|(?i)Hong))^((?!(台||日韩|新|深|美)).)*$,
      type: url-test,
      interval: 300,
      tolerance: 20,
    }
  - {
      name: DE 德国自动,
      include-all: true,
      filter: (?=.*(德|英|俄罗斯|法|荷|阿|芬兰|瑞|挪威|丹麦))^((?!(港|台|韩|日|新|美)).)*$,
      type: url-test,
      interval: 300,
      tolerance: 20,
    }

# 规则集
rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
  class:
    &class { type: http, interval: 86400, behavior: classical, format: text }
